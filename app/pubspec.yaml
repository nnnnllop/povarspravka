name: povarspravka
description: "Поварская справка — офлайн калькулятор пищевой ценности блюд по справочнику Скурихина и USDA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # SQLite offline database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Document Generation & Export
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0
  archive: ^3.5.1
  xml: ^6.5.0

  # Utilities & UI
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/db/reference.db
    - assets/fonts/arial.ttf
    - assets/fonts/arialbd.ttf

  fonts:
    - family: Arial
      fonts:
        - asset: assets/fonts/arial.ttf
        - asset: assets/fonts/arialbd.ttf
          weight: 700
